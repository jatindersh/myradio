<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian TV Channels (IPTV-org)</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 350px; background-color: #1e1e1e; overflow-y: auto; padding: 10px; border-right: 1px solid #333; }
        .channel-btn { display: flex; align-items: center; width: 100%; padding: 10px; margin-bottom: 5px; background-color: #2c2c2c; color: white; border: none; cursor: pointer; text-align: left; font-size: 14px; border-radius: 5px; transition: background 0.2s; }
        .channel-btn img { width: 60px; height: auto; margin-right: 15px; border-radius: 3px; background: #000; object-fit: contain; }
        .channel-btn:hover, .channel-btn.active { background-color: #007bff; }
        #player-container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000; padding: 20px; }
        video { width: 100%; max-width: 1200px; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #111; }
        h2 { margin-bottom: 10px; font-size: 18px; text-align: center; color: #aaa; }
        #loading { text-align: center; color: #888; margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2 style="color: #fff;">Indian Channels</h2>
        <div id="loading">Fetching live playlist...</div>
        <div id="channel-list"></div>
    </div>

    <div id="player-container">
        <h2 id="current-channel">Select a channel from the sidebar</h2>
        <video id="video" controls autoplay></video>
    </div>

    <script>
        // Open-source IPTV-org playlist for India
        const playlistUrl = "https://iptv-org.github.io/iptv/countries/in.m3u";
        
        const channelList = document.getElementById('channel-list');
        const video = document.getElementById('video');
        const currentChannelTitle = document.getElementById('current-channel');
        const loadingText = document.getElementById('loading');

        let hlsPlayer = null;

        async function loadPlaylist() {
            try {
                const response = await fetch(playlistUrl);
                if (!response.ok) throw new Error("Network response failed");
                const m3uText = await response.text();
                parseM3U(m3uText);
            } catch (error) {
                loadingText.innerHTML = `<span style="color:#ff4d4d">Error loading playlist.</span><br><br>Make sure you are running this file on a local web server (like VS Code Live Server) and not directly from your C: Drive.`;
                console.error(error);
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    // Extract channel name (everything after the last comma)
                    const splitByComma = line.split(',');
                    currentChannel.name = splitByComma.length > 1 ? splitByComma.pop().trim() : "Unknown Channel";
                    
                    // Extract logo
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    if (logoMatch) currentChannel.logo = logoMatch[1];

                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    // Filter out non-video links just in case
                    if(currentChannel.url.includes('.m3u8') || currentChannel.url.includes('.ts')) {
                        channels.push(currentChannel);
                    }
                    currentChannel = {}; 
                }
            }
            
            loadingText.style.display = 'none';
            renderChannels(channels);
        }

        function renderChannels(channels) {
            channels.forEach((channel) => {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                
                let imgHtml = channel.logo ? `<img src="${channel.logo}" alt="logo" onerror="this.style.display='none'">` : `<div style="width:60px; height:34px; margin-right:15px; background:#444;"></div>`;
                
                btn.innerHTML = `${imgHtml} <span>${channel.name}</span>`;
                btn.onclick = () => playChannel(channel.url, channel.name, btn);
                channelList.appendChild(btn);
            });
        }

        function playChannel(url, name, btnElement) {
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            currentChannelTitle.innerText = "Playing: " + name;

            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() { 
                    video.play(); 
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { 
                    video.play(); 
                });
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
