<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zee News Live TV Hindi</title>
<script>
    // Tell the Android App to unlock the screen and allow rotation
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }
</script>
<script>
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });
 
    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body {
        text-align: center;
        background-color: black;
        color: white;
        margin: 0;
        padding: 0;
        overflow: hidden; 
    }

    .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    /* Standard Iframe styling */
    #player {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        border: none;
    }

    .home-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 10;
    }

    .refresh-btn {
      position: fixed;
      bottom: 10px;
      left: 10px;
      cursor: pointer;
      z-index: 10;
    }

    /* Fallback warning if they hold phone vertically on iOS */
    #portrait-warning {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: black;
        color: white;
        z-index: 9999;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 1.2rem;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }

    @media screen and (orientation: portrait) {
        #portrait-warning {
            display: flex;
        }
        .video-container, .home-btn, .refresh-btn {
            display: none;
        }
    }
</style>
</head>
<body>

  <!-- iOS Fallback Warning -->
  <div id="portrait-warning">
      <div>
        <p style="font-size: 50px; margin: 0 0 15px 0;">🔄</p>
        Please rotate your device sideways.
      </div>
  </div>

  <div class="video-container">
    <!-- Stream loaded directly with autoplay and unmuted parameters -->
    <iframe id="player" 
            src="https://zeenews.india.com/hindi/news/live-tv?videoId=183&taptounmute=0&mute=0&piv=1&pip=0&autoplay=1" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
  </div>

  <img src="image/refresh.jpg" alt="Reload" id="refreshButton"
       onclick="location.reload();" width="70" height="70" class="refresh-btn">

  <a href="tvtvnews.html" class="home-btn">
    <img src="image/home.png" alt="Back To Home" width="65" height="65">
  </a>

</body>
</html>
