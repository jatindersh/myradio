<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zee News Live TV Hindi</title>

<script>
    // Tell the Android App to unlock the screen and allow rotation
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }

    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: black;
        overflow: hidden;
    }

    /* Make the iframe take up the entire screen */
    #player {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }

    /* Floating Button Styles */
    .overlay-btn {
        position: fixed;
        top: 15px;
        z-index: 9999;
        width: 55px;
        height: 55px;
        cursor: pointer;
        opacity: 0.7;
        transition: opacity 0.2s ease, transform 0.2s ease;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 50%;
        padding: 5px;
    }

    .overlay-btn:hover {
        opacity: 1;
    }

    .overlay-btn:active {
        transform: scale(0.9);
    }

    .refresh-btn {
        left: 15px;
    }

    .home-btn {
        right: 15px;
        border-radius: 8px; /* Slightly different shape for home if desired */
    }
</style>
</head>
<body>

  <!-- The video player loads directly -->
  <iframe id="player" 
          src="https://zeenews.india.com/hindi/news/live-tv?videoId=183&taptounmute=0&mute=0&piv=1&pip=0&autoplay=1" 
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
          allowfullscreen>
  </iframe>

  <!-- Refresh Button (Only reloads the iframe) -->
  <img src="image/refresh.png" alt="Reload" id="refreshButton" onclick="refreshStream();" class="overlay-btn refresh-btn">

  <!-- Home Button -->
  <a href="tvtvnews.html">
    <img src="image/home.jpg" alt="Back To Home" class="overlay-btn home-btn">
  </a>

  <script>
    // Function to reload ONLY the iframe, keeping the app intact
    function refreshStream() {
        var playerIframe = document.getElementById('player');
        
        // Base URL of the stream
        var baseUrl = "https://zeenews.india.com/hindi/news/live-tv?videoId=183&taptounmute=0&mute=0&piv=1&pip=0&autoplay=1";
        
        // Temporarily clear src to stop the crashed video
        playerIframe.src = '';
        
        setTimeout(function() {
            // Re-assign the URL with a timestamp cache-buster so the browser is forced to pull a fresh stream
            playerIframe.src = baseUrl + "&refresh=" + new Date().getTime();
        }, 150);
    }
  </script>

</body>
</html>
