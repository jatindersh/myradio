<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aaj Tak Live TV Custom Player</title>

<!-- Required Stylesheet for the Aaj Tak player -->
<link rel="stylesheet" href="https://feeds.intoday.in/livetv/ver-3-0/livetv-min.css?ver=21-02-2025"/>
<script>
    // Tell the Android App to unlock the screen and allow rotation
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }
</script>
<script>
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body {
        text-align: center;
        background-color: black;
        color: white;
        margin: 0;
        padding: 0;
        overflow: hidden; 
    }

    /* Video Container */
    .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    #vidcont {
        width: 100%;
        height: 100%;
        position: relative;
    }

    #videoplayer {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
    }

    /* Controls positioned at the top */
    .home-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
    }

    .refresh-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        cursor: pointer;
        z-index: 100;
    }

    /* Fullscreen interaction overlay */
    #start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        backdrop-filter: blur(5px);
    }

    .start-btn {
        background: #e50914;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        padding: 20px 40px;
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        animation: pulse 1.5s infinite;
        user-select: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

  <!-- Tap to Start Overlay (Required for Fullscreen API) -->
  <div id="start-overlay">
      <div class="start-btn">▶ Tap to Watch in Fullscreen</div>
  </div>

  <!-- Target container for the script to load the video -->
  <div class="video-container">
      <div id="vidcont">
          <div id="videoplayer"></div>
      </div>
  </div>

  <img src="image/refresh.jpg" alt="Reload" id="refreshButton"
       onclick="location.reload();" width="70" height="70" class="refresh-btn">

  <a href="tvtvnews.html" class="home-btn">
    <img src="image/home.png" alt="Back To Home" width="65" height="65">
  </a>

  <!-- Required Library Dependencies for the player -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://feeds.intoday.in/livetv/hls.min.js?noCache=2020-04-16-0935"></script>
  <script src="https://feeds.intoday.in/livetv/ver-3-0/livetv-min.js?ver=21-02-2025"></script>

  <script>
    // Initialize the player directly when the document is ready
    $(document).ready(function() {
        var athdParam = {
            default_Player: "",
            gap_ac: "UA-7530357-30",
            id: "livetv-athd",
            isLive: "true",
            aud_togle: "false", // Tells the player to attempt unmuted playback
            noads: "true",
            autostart: 1, // Keeps auto-play enabled
            url: 'U2FsdGVkX1/zIF4LlDlcGBWc1rAiG9U3y7v9ZUzCVuBZgyjw0/QE+rIRpivjysaK9K+QTKJQ7ihOBxBb+9ZO0xGMrVP3vh9dddoq5JdXOMs=',
            title: "Aajtak HD Live TV",
            share_link: "https://www.aajtakhd.com",
            publisherId: "8549097"
        };
        
        // This triggers the custom script to build the video element inside #videoplayer automatically
        var livetv = new liveTvEmbed(athdParam, "videoplayer");
    });

    // Fullscreen & Landscape logic triggered by overlay click
    document.addEventListener("DOMContentLoaded", function() {
        var startOverlay = document.getElementById('start-overlay');

        startOverlay.addEventListener('click', function() {
            var docElm = document.documentElement;

            // 1. Request Fullscreen across all browser types
            var requestFS = docElm.requestFullscreen || 
                            docElm.mozRequestFullScreen || 
                            docElm.webkitRequestFullscreen || 
                            docElm.msRequestFullscreen;
            
            if (requestFS) {
                // Use Promise if available to lock orientation immediately after fullscreen activates
                var fsPromise = requestFS.call(docElm);
                if (fsPromise !== undefined) {
                    fsPromise.then(function() {
                        lockLandscape();
                    }).catch(function(err) {
                        console.log("Fullscreen request failed: ", err);
                        // Try locking anyway if fullscreen fails
                        lockLandscape();
                    });
                } else {
                    // Fallback for older browsers
                    lockLandscape();
                }
            } else {
                lockLandscape(); // Fallback if Fullscreen API is missing (e.g. iOS Safari)
            }

            // 2. Hide the overlay
            startOverlay.style.display = 'none';
            
            // Try to play the media if it failed to autoplay
            var videoTags = document.getElementsByTagName('video');
            if(videoTags.length > 0) {
                videoTags[0].play().catch(function(e){ console.log(e); });
            }
        });

        // Function to lock orientation
        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function(error) {
                    console.log("Landscape lock failed: ", error);
                });
            }
        }
    });
  </script>
</body>
</html>
