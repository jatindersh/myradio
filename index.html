    <script>
        document.addEventListener("contextmenu", function(event) { event.preventDefault(); });
        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
                event.preventDefault();
                alert("Viewing source is disabled!");
            }
        });

        // Ensure orientation is locked
        window.addEventListener("load", function() {
            if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.lockPortrait === 'function') {
                AndroidApp.lockPortrait();
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(function(error) {});
            }
        });
    </script>

    <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      max-width: 100vw;
      overflow-x: hidden;
      background: #000;
      color: #fff;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* --- PREVENTS TEXT SELECTION ANYWHERE ON SCREEN --- */
      -webkit-user-select: none; /* Chrome, Safari, Android */
      -moz-user-select: none;    /* Firefox */
      -ms-user-select: none;     /* IE/Edge */
      user-select: none;         /* Standard syntax */
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 10px;
      box-sizing: border-box;
    }

    /* PURE CSS MARQUEE - GPU ACCELERATED */
    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .marquee-with-dr {
      display: inline-block;
      padding-left: 100%;
      animation: marquee-scroll 22s linear infinite;
      font-size: 20px;
    }

    @keyframes marquee-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    #rcorners4 {
      background: #000;
      border-radius: 5px 70px 5px 70px;
      border: 2px solid grey;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      width: 100%;
      margin: 0 auto;
      border-collapse: separate;
      border-spacing: 12px;
      table-layout: fixed;
      text-align: center;
      box-sizing: border-box;
    }

    td {
      text-align: center;
      vertical-align: middle;
    }

    a.buttonone {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      height: 55px !important; 
      box-sizing: border-box !important;
      text-align: center !important;
      white-space: normal !important; 
      margin: 0 !important; 
      padding: 5px !important;
      font-size: clamp(14px, 4vw, 16px) !important;
      line-height: 1.2 !important;
      border-radius: 8px;
      text-decoration: none;
    }

    .time-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #000000 40%, #0c0c0c 100%); 
      padding: 12px 10px; 
      border-radius: 16px;
      border: 2px solid #77f34e;
      box-shadow: 0 0 20px rgba(7, 4, 4, 0.5); 
      margin: 5px auto 10px auto;
      width: 100%;
      box-sizing: border-box;
    }

    .date {
        background-image: linear-gradient(to left, rgb(0,0,0) 50%, rgb(204,0,0) 51%);
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        border-radius: 10px;
        font-size: clamp(16px, 6.5vw, 26px);
        white-space: nowrap; 
        padding: 2px 0;
    }

    .clock {
        background-image: linear-gradient(to right, rgb(0,0,0) 50%, rgb(204,0,0) 51%);
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        border-radius: 10px;
        font-size: clamp(22px, 9vw, 40px);
        font-weight: bold;
        white-space: nowrap;
    }

    #exitButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 10px auto;
      cursor: pointer;
      border: none;
      background-color: #ffffff; 
      padding: 6px 16px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.8); 
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #exitButton:active {
      transform: scale(0.92);
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); 
    }

    #exitButton img {
      width: 90px;
      height: 30px;
    }
    </style>
</head>

    </div>

    <script>
        function showTime() {
            let time = new Date();
            let hour = time.getHours();
            let min = time.getMinutes();
            let sec = time.getSeconds();
            let am_pm = "AM";
            
            if (hour >= 12) {
                if (hour > 12) hour -= 12;
                am_pm = "PM";
            }
            if (hour == 0) {
                hour = 12;
                am_pm = "AM";
            }
            
            hour = hour < 10 ? "0" + hour : hour;
            min = min < 10 ? "0" + min : min;
            sec = sec < 10 ? "0" + sec : sec;
            
            document.getElementById("clock").innerHTML = hour + ":" + min + ":" + sec + " " + am_pm;
        }
        
        const d = new Date();
        document.getElementById("datee").innerHTML = d.toDateString();
        
        setInterval(showTime, 1000);
        showTime();

        document.getElementById('exitButton').addEventListener('click', function() {
            if (typeof AndroidApp !== 'undefined') {
                AndroidApp.exitApp();
            } else {
                window.close();
            }
        });
    </script>
