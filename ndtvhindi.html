<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NDTV India Live TV Hindi</title>
<script>
    // Tell the Android App to unlock the screen and allow rotation
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }
</script>
<!-- HLS.js Library for cross-browser stream support -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body {
        text-align: center;
        background-color: black;
        color: white;
        margin: 0;
        padding: 0;
        overflow: hidden; 
    }

    .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    /* HTML5 Video Tag for HLS Stream */
    #player {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        border: none;
        outline: none;
        background: black;
        object-fit: contain;
    }

    /* Controls positioned at the top */
    .home-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
    }

    .refresh-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        cursor: pointer;
        z-index: 100;
    }

    /* Fullscreen interaction overlay */
    #start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        backdrop-filter: blur(5px);
    }

    .start-btn {
        background: #e50914;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        padding: 20px 40px;
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        animation: pulse 1.5s infinite;
        user-select: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

  <!-- Tap to Start Overlay (Required for Fullscreen API & Audio) -->
  <div id="start-overlay">
      <div class="start-btn">▶ Tap to Watch in Fullscreen</div>
  </div>

  <div class="video-container">
    <!-- HTML5 Video Player for the .m3u8 stream -->
    <video id="player" controls autoplay playsinline muted></video>
  </div>

  <img src="image/refresh.png" alt="Reload" id="refreshButton"
       onclick="location.reload();" width="70" height="70" class="refresh-btn">

  <a href="tvtvnews.html" class="home-btn">
    <img src="image/home.jpg" alt="Back To Home" width="65" height="65">
  </a>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        var video = document.getElementById('player');
        var videoSrc = "https://ndtvindiaelemarchana.akamaized.net/hls/live/2003679/ndtvindia/master.m3u8";

        // Play the HLS Stream safely using the HLS.js library
        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log("Autoplay blocked, waiting for interaction");
                });
            });
        } 
        // Fallback for native HLS support (like Safari and iOS)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function(error) {
                    console.log("Autoplay blocked, waiting for interaction");
                });
            });
        }

        // Fullscreen & Landscape logic triggered by overlay click
        var startOverlay = document.getElementById('start-overlay');

        startOverlay.addEventListener('click', function() {
            var docElm = document.documentElement;

            // 1. Unmute and Play video
            if (video) {
                video.muted = false; // Turn sound on
                video.play().catch(function(e) { console.log(e); });
            }

            // 2. Request Fullscreen across all browser types
            var requestFS = docElm.requestFullscreen || 
                            docElm.mozRequestFullScreen || 
                            docElm.webkitRequestFullscreen || 
                            docElm.msRequestFullscreen;
            
            if (requestFS) {
                // Use Promise if available to lock orientation immediately after fullscreen activates
                var fsPromise = requestFS.call(docElm);
                if (fsPromise !== undefined) {
                    fsPromise.then(function() {
                        lockLandscape();
                    }).catch(function(err) {
                        console.log("Fullscreen request failed: ", err);
                        // Try locking anyway if fullscreen fails
                        lockLandscape();
                    });
                } else {
                    // Fallback for older browsers
                    lockLandscape();
                }
            } else {
                lockLandscape(); // Fallback if Fullscreen API is missing (e.g. iOS Safari)
            }

            // 3. Hide the overlay
            startOverlay.style.display = 'none';
        });

        // Function to lock orientation
        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function(error) {
                    console.log("Landscape lock failed: ", error);
                });
            }
        }
    });
  </script>
</body>
</html>
