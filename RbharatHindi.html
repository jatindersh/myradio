<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Republic Bharat Live TV Hindi</title>
<script>
    // Unlock orientation for Android WebViews
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }
</script>

<script>
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body {
        text-align: center;
        background-color: black;
        color: white;
        margin: 0;
        padding: 0;
        overflow: hidden; 
    }

    .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    /* Embedded iframe for YuppTV player */
    #player {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        background: black;
    }

    /* Controls positioned at the top */
    .home-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
    }

    .refresh-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        cursor: pointer;
        z-index: 100;
    }

    /* Interactive Unmute / Tap to Play Overlay */
    #unmute-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.65);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(3px);
    }

    .unmute-box {
        background: #e50914;
        color: #ffffff;
        padding: 16px 32px;
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.7);
        animation: pulse 1.8s infinite;
        user-select: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }

    /* Fallback warning for portrait mode */
    #portrait-warning {
        display: none;
        position: fixed;
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh;
        background: black;
        color: white;
        z-index: 99999;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 1.2rem;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
    }

    @media screen and (orientation: portrait) {
        #portrait-warning {
            display: flex;
        }
        .video-container, .home-btn, .refresh-btn, #unmute-overlay {
            display: none;
        }
    }
</style>
</head>
<body>

  <!-- Orientation Fallback Warning -->
  <div id="portrait-warning">
      <div>
        <p style="font-size: 50px; margin: 0 0 15px 0;">🔄</p>
        Please rotate your device sideways.
      </div>
  </div>

  <!-- Sound Permission Overlay -->
  <div id="unmute-overlay">
      <div class="unmute-box">🔊 Tap Here to Turn On Sound</div>
  </div>

  <!-- Top Controls -->
  <img src="image/refresh.jpg" alt="Reload" id="refreshButton"
       onclick="location.reload();" width="60" height="60" class="refresh-btn">

  <a href="tvtvnews.html" class="home-btn">
    <img src="image/home.png" alt="Back To Home" width="60" height="60">
  </a>

  <!-- Main Player Stream -->
  <div class="video-container">
    <iframe 
        id="player" 
        src="https://www.yupptv.com/channels/republic-bharat/live/embed" 
        allow="autoplay; fullscreen; encrypted-media" 
        allowfullscreen>
    </iframe>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        var overlay = document.getElementById('unmute-overlay');
        var iframe = document.getElementById('player');

        // Capture user tap to bypass browser autoplay/sound restrictions
        overlay.addEventListener('click', function() {
            // Re-assign src to trigger clean autoplay within the iframe after user interaction
            var currentSrc = iframe.src;
            iframe.src = currentSrc;

            // Remove overlay so player controls become interactable
            overlay.style.display = 'none';

            // Enable fullscreen and landscape lock
            var docElm = document.documentElement;
            if (docElm.requestFullscreen) { 
                docElm.requestFullscreen().catch(function(){}); 
            } else if (docElm.webkitRequestFullscreen) { 
                docElm.webkitRequestFullscreen().catch(function(){}); 
            }

            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function(e) {
                    console.log("Orientation lock not permitted: ", e);
                });
            }
        });
    });
  </script>
</body>
</html>
