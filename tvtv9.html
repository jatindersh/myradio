<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TV9 Hindi News</title>
<script>
    // Tell the Android App to unlock the screen and allow rotation
    if (typeof AndroidApp !== 'undefined' && typeof AndroidApp.unlockOrientation === 'function') {
        AndroidApp.unlockOrientation();
    }
</script>
<script>
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Block Ctrl+U
    document.addEventListener("keydown", function(event) {
        if (event.ctrlKey && (event.key === 'u' || event.key === 'U')) {
            event.preventDefault();
            alert("Viewing source is disabled!");
        }
    });
</script>

<style>
    body {
        text-align: center;
        background-color: black;
        color: white;
        margin: 0;
        padding: 0;
        overflow: hidden; 
    }

    .video-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background: #000;
    }

    /* Iframe Styling */
    #player {
        width: 100%;
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        border: none;
        outline: none;
        background: black;
    }

    /* Controls positioned at the top */
    .home-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 100;
    }

    .refresh-btn {
        position: fixed;
        top: 12px;
        left: 12px;
        cursor: pointer;
        z-index: 100;
    }

    /* Fullscreen interaction overlay */
    #start-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        backdrop-filter: blur(5px);
    }

    .start-btn {
        background: #e50914;
        color: white;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        padding: 20px 40px;
        border-radius: 50px;
        box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        animation: pulse 1.5s infinite;
        user-select: none;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

  <!-- Tap to Start Overlay (Required for Fullscreen API & Audio bypass) -->
  <div id="start-overlay">
      <div class="start-btn">▶ Tap to Watch in Fullscreen</div>
  </div>

  <!-- Top Controls -->
  <img src="image/refresh.png" alt="Reload" id="refreshButton" onclick="location.reload();" width="60" height="60" class="refresh-btn">
  
  <a href="tvtvnews.html" class="home-btn">
    <img src="image/home.png" alt="Back To Home" width="60" height="60">
  </a>

  <div class="video-container">
    <!-- TV9 Hindi iframe loaded immediately with autoplay parameters added (muted to allow loading) -->
    <iframe id="player" 
            src="https://static.vidgyor.com/player/account/tv9/html/tv9_v12.html?videoId=aca8e80cceddb_live&accountId=62bafd8513ddad0009e72496&autoplay=1&muted=1" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
    </iframe>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
        var startOverlay = document.getElementById('start-overlay');
        var iframe = document.getElementById('player');

        // Capture user tap to bypass browser autoplay/sound restrictions and enter fullscreen
        startOverlay.addEventListener('click', function() {
            var docElm = document.documentElement;

            // 1. Re-assign src to trigger clean autoplay within the iframe after user interaction
            // Automatically switch "muted=1" to "muted=0" to turn on sound
            var currentSrc = iframe.src;
            iframe.src = currentSrc.replace('muted=1', 'muted=0');

            // 2. Request Fullscreen across all browser types
            var requestFS = docElm.requestFullscreen || 
                            docElm.mozRequestFullScreen || 
                            docElm.webkitRequestFullscreen || 
                            docElm.msRequestFullscreen;
            
            if (requestFS) {
                // Use Promise if available to lock orientation immediately after fullscreen activates
                var fsPromise = requestFS.call(docElm);
                if (fsPromise !== undefined) {
                    fsPromise.then(function() {
                        lockLandscape();
                    }).catch(function(err) {
                        console.log("Fullscreen request failed: ", err);
                        // Try locking anyway if fullscreen fails
                        lockLandscape();
                    });
                } else {
                    // Fallback for older browsers
                    lockLandscape();
                }
            } else {
                lockLandscape(); // Fallback if Fullscreen API is missing (e.g. iOS Safari)
            }

            // 3. Remove overlay so player controls become interactable
            startOverlay.style.display = 'none';
        });

        // Function to lock orientation
        function lockLandscape() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function(error) {
                    console.log("Landscape lock failed: ", error);
                });
            }
        }
    });
  </script>
</body>
</html>
