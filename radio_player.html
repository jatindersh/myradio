<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live TV News Radio</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            height: 100dvh; /* Ensures proper height on mobile in landscape/portrait */
            overflow: hidden;
        }

        .radio-wrapper {
            display: flex; /* Changed from 'none' to 'flex' so it shows on load */
            width: 100vw;
            max-width: 600px;
            height: 100%;
            flex-direction: column;
            background-color: #000000;
        }

        .top-section {
            flex-shrink: 0;
            padding: 20px 15px 10px 15px;
            text-align: center;
        }

        .status {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #FFFFFF;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .station-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .station-name {
            font-size: 22px;
            font-weight: bold;
            color: #FFD700;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0px 2px 4px rgba(255, 215, 0, 0.3);
            max-width: 60%;
        }

        .speaker1, .speaker2 {
            display: block;
            width: 40px;
            height: auto;
            user-select: none;
        }
        .speaker1.playing, .speaker2.playing {
            animation: boom 1.2s infinite;
        }
        @keyframes boom {
            0% { transform: scale(1);}
            50% { transform: scale(1.15);}
            100% { transform: scale(1);}
        }

        .audio-controls {
            flex-shrink: 0;
            padding: 12px;
            background-color: #000000;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #custom-audio-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 12px;
        }

        .btn-custom {
            padding: 10px 20px;
            background-color: #373b44;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease-in-out;
            outline: none;
        }
        .btn-custom:hover {
            background-color: #4a505c;
            border-color: rgba(255, 255, 255, 0.8);
        }
        .btn-custom:active { transform: scale(0.95); }
        .btn-custom svg { width: 18px; height: 18px; fill: #ffffff; }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 5px; cursor: pointer; background: #1877f2; border-radius: 4px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 14px; width: 14px; border-radius: 50%; background: #1877f2; cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            margin-top: -4.5px;
        }

        .playlist-container {
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 0;
            min-height: 0;
            overflow-y: auto;
            padding: 12px 15px;
        }

        .playlist-container::-webkit-scrollbar { width: 4px; }
        .playlist-container::-webkit-scrollbar-track { background: #000; }
        .playlist-container::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .station-list { list-style: none; margin: 0; padding: 0; }
        .station-list li {
            padding: 14px 16px;
            margin-bottom: 10px;
            background-color: #000000;
            border: 1px solid #FFF44F;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .station-list li span:first-child { font-size: 16px; font-weight: bold; color: #FFFFFF; }
        .station-list li.active {
            background-color: #1a1a00;
            border: 2px solid #FFD700;
            box-shadow: inset 0px 0px 10px rgba(255, 215, 0, 0.3);
        }
        .station-list li.active span:first-child { color: #FFD700; }

        .badge {
            font-size: 10px; padding: 3px 6px; border-radius: 4px;
            background-color: #333; color: #FFF44F; font-weight: bold;
        }

        .bottom-bar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px;
            background-color: #000000;
            border-top: 1px solid #1a1a1a;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        .refresh-btn, .home-btn {
            background: transparent; border: none; cursor: pointer;
            padding: 0; outline: none; display: flex; align-items: center; justify-content: center;
        }
        .refresh-img, .home-img {
            width: 45px; height: 45px;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 2px 8px #222);
        }
        @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
        .refresh-btn:hover .refresh-img, .home-btn:hover .home-img {
            animation: spin 1.5s infinite linear;
        }

        .exit-btn {
            background-color: #373b44;
            color: #ffffff;
            border: 1px solid #444;
            padding: 8px 25px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .exit-btn:hover {
            background-color: #5c1818;
            border-color: #ff4444;
            color: #ff4444;
        }
        .exit-btn:active { transform: scale(0.95); }

        #audio-player { display: none; }
        #iframe-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none; }

    </style>
</head>
<body>

<div class="radio-wrapper" id="radio-wrapper">

    <div class="top-section">
        <div class="status" id="status-text">READY</div>
        <div class="station-header">
            <img src="image/speaker.png" alt="Speaker" class="speaker1" id="speaker1">
            <h2 class="station-name" id="current-station">Select a Station</h2>
            <img src="image/speaker.png" alt="Speaker" class="speaker2" id="speaker2">
        </div>
    </div>

    <div class="audio-controls">
        <div id="custom-audio-wrapper">
            <button id="pauseBtn" class="btn-custom" aria-label="Pause">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <div class="volume-container">
                <span style="color: #a0aab5; font-size: 16px;">🔊</span>
                <input id="volumeSlider" type="range" min="0" max="1" step="0.1" value="1">
            </div>
        </div>

        <audio id="audio-player" playsinline preload="auto"></audio>
        <iframe id="iframe-player" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="playlist-container">
        <ul class="station-list" id="playlist"></ul>
    </div>

    <div class="bottom-bar">
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh page">
            <img src="image/refresh.jpg" alt="Refresh" class="refresh-img" />
        </button>

        <button class="exit-btn" id="exitAppBtn" aria-label="Exit Application">
            <span id="exitIcon" style="color: #ff4444; font-size: 14px;">✖</span> <span>EXIT APP</span>
        </button>

        <button class="home-btn" id="rhomeBtn" aria-label="home page">
            <img src="image/home.png" alt="Home" class="home-img" />
        </button>
    </div>

</div>

<script>
    const stations = [
        { name: "Aaj Tak HD", url: "https://feeds.intoday.in/aajtak/api/aajtakhd/master.m3u8", type: "M3U8" },
        { name: "Zee News Hindi", url: "https://zeenews.india.com/hindi/live-tv/embed?autoplay=1&mute=0", type: "WEB" },
        { name: "Republic Bharat", url: "https://vg-republictvlive.akamaized.net/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/vglive-sk-275673/main.m3u8", type: "M3U8" },
        { name: "TV9 Hindi", url: "https://static.vidgyor.com/player/account/tv9/html/tv9_v12.html?videoId=aca8e80cceddb_live&accountId=62bafd8513ddad0009e72496&autoplay=1&mute=0", type: "WEB" },
        { name: "NDTV India", url: "https://ndtvindiaelemarchana.akamaized.net/hls/live/2003679/ndtvindia/master.m3u8", type: "M3U8" },
        { name: "ABP News", url: "https://cdn.abplive.com/LiveStreams/abp_live_tv/hindi/live-tv.html?autoplay=1&mute=0", type: "WEB" },
        { name: "India TV", url: "https://www.indiatvnews.com/iframe/playerlivetv?accountId=63bd2161756d5f000872bc0b&videoId=9ffbeb67a09d8_live&playerDivId=vidgyor&pip=0&piv=0&autoplay=1&mute=0&aspectRatio=16:9", type: "WEB" },
        { name: "Vividh Bharti", url: "https://air.pc.cdn.bitgravity.com/air/live/pbaudio001/playlist.m3u8", type: "M3U8" },
        { name: "Jammu", url: "https://air.pc.cdn.bitgravity.com/air/live/pbaudio128/playlist.m3u8", type: "M3U8" },
        { name: "Radio Mirchi", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/NJS_HIN_ESTAAC.m3u8", type: "M3U8" },
        { name: "FM Rainbow", url: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio004/hlspbaudio00464kbps.m3u8", type: "M3U8" },
        { name: "Dharamshala", url: "https://air.pc.cdn.bitgravity.com/air/live/pbaudio165/playlist.m3u8", type: "M3U8" },
        { name: "Dehradun", url: "https://air.pc.cdn.bitgravity.com/air/live/pbaudio191/playlist.m3u8", type: "M3U8" },
        { name: "Air News", url: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio002/hlspbaudio002_Auto.m3u8", type: "M3U8" },
        { name: "Big Fm", url: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio006/hlspbaudio006_Auto.m3u8", type: "M3U8" },
        { name: "FM Gold", url: "https://airhlspush.pc.cdn.bitgravity.com/httppush/hlspbaudio005/hlspbaudio005_Auto.m3u8", type: "M3U8" },
        { name: "Radio City", url: "https://server.mixify.in:8010/radio.mp3?type=http&nocache=15412/;stream/1", type: "MP3" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        const audioPlayer = document.getElementById('audio-player');
        const iframePlayer = document.getElementById('iframe-player');
        const pauseBtn = document.getElementById('pauseBtn');
        const volSlider = document.getElementById('volumeSlider');

        const playlistElement = document.getElementById('playlist');
        const currentStationText = document.getElementById('current-station');
        const statusText = document.getElementById('status-text');
        const speakers = document.querySelectorAll('.speaker1, .speaker2');

        let hls = null;
        let wakeLock = null;
        let currentActiveStation = null;

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        function setupMediaSession(stationName) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: stationName,
                    artist: 'Live Broadcast Station',
                    album: 'Tuner App'
                });
            }
        }

        function renderPlaylist() {
            playlistElement.innerHTML = '';
            stations.forEach((station, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${station.name}</span> <span class="badge">${station.type}</span>`;
                li.onclick = () => playStation(station, li);
                playlistElement.appendChild(li);
            });
        }

        function setUIPlayingState(isEmbedded) {
            statusText.innerText = isEmbedded ? "LIVE (EMBED)" : "LIVE BROADCAST";
            speakers.forEach(s => s.classList.add('playing'));
            requestWakeLock();
        }

        function setUIPausedState() {
            statusText.innerText = "PAUSED";
            speakers.forEach(s => s.classList.remove('playing'));
            releaseWakeLock();
        }

        function playStation(station, listItem) {
            currentActiveStation = station;
            document.querySelectorAll('.station-list li').forEach(el => el.classList.remove('active'));
            if (listItem) listItem.classList.add('active');

            currentStationText.innerText = station.name;
            statusText.innerText = "CONNECTING...";
            speakers.forEach(s => s.classList.remove('playing'));

            setupMediaSession(station.name);
            requestWakeLock();

            if (hls) { hls.destroy(); hls = null; }
            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            audioPlayer.load();
            iframePlayer.src = "";

            if (station.type === "WEB") {
                iframePlayer.src = station.url;
                setTimeout(() => { setUIPlayingState(true); }, 2500);
            } else {
                if (station.type === "M3U8") {
                    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                        hls = new Hls();
                        hls.loadSource(station.url);
                        hls.attachMedia(audioPlayer);
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            // Handles autoplay block if user hasn't interacted yet
                            audioPlayer.play().catch(e => console.log(e));
                        });
                    } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                        audioPlayer.src = station.url;
                        audioPlayer.play().catch(e => console.log(e));
                    } else {
                        statusText.innerText = "UNSUPPORTED FORMAT";
                    }
                } else {
                    audioPlayer.src = station.url;
                    audioPlayer.play().catch(e => console.log(e));
                }
            }
        }

        pauseBtn.addEventListener('click', () => {
            if (!currentActiveStation) return;
            if (currentActiveStation.type === "WEB") {
                iframePlayer.src = "";
                setUIPausedState();
            } else {
                audioPlayer.pause();
            }
        });

        volSlider.addEventListener('input', function() {
            audioPlayer.volume = this.value;
        });

        audioPlayer.addEventListener('playing', () => setUIPlayingState(false));
        audioPlayer.addEventListener('pause', setUIPausedState);
        audioPlayer.addEventListener('waiting', () => {
            statusText.innerText = "BUFFERING...";
            speakers.forEach(s => s.classList.remove('playing'));
        });
        audioPlayer.addEventListener('error', () => {
            statusText.innerText = "STREAM OFFLINE";
            speakers.forEach(s => s.classList.remove('playing'));
        });

        document.getElementById('refreshBtn').addEventListener('click', function() {
            this.querySelector('.refresh-img').style.animation = 'spin 1s linear infinite';
            setTimeout(() => { window.location.reload(); }, 500);
        });

        document.getElementById('rhomeBtn').addEventListener('click', function() {
            this.querySelector('.home-img').style.animation = 'spin 1s linear infinite';
            setTimeout(() => { window.location.href = "tvhome.html"; }, 500);
        });

        // EXIT APPLICATION LOGIC
        document.getElementById('exitAppBtn').addEventListener('click', () => {
            if (typeof AndroidApp !== 'undefined') {
                AndroidApp.exitApp();
            } else {
                console.log("Exit button triggered. Closing window.");
                window.close();
            }
        });

        // Initialize app and load the playlist
        renderPlaylist();

        // Auto-select the first station automatically on page load
        if (stations.length > 0) {
            const firstListItem = document.querySelector('.station-list li');
            playStation(stations[0], firstListItem);
        }
    });
</script>
</body>
</html>
